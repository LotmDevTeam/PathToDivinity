plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// -PlotmOnly: leave every optional integration off the runtime classpath (they stay compileOnly), to
// check that Path to Divinity still loads and works with only LOTM and its libraries, e.g.
// ./gradlew runGameTestServer -PlotmOnly
def lotmOnly = project.hasProperty('lotmOnly')
def optionalMod = lotmOnly ? 'compileOnly' : 'implementation'
def optionalRuntime = lotmOnly ? 'compileOnly' : 'runtimeOnly'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

neoForge {
    version = neo_version

    parchment {
        mappingsVersion = parchment_mappings_version
        minecraftVersion = parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Run directories are untracked and shared with the Forge branch, so NeoForge runs get their own
    // (run-neo*): a 1.21.1 server would upgrade, and so break, a 1.20.1 world left in run/.
    runs {
        configureEach {
            gameDirectory = project.file('run-neo')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        // A second dev client, for testing anything that needs two players in the world at once —
        // profile regression and the characteristic drop, which both return early on a self-kill.
        // Needs its own username (two 'Dev' players cannot share a world) and its own game
        // directory, so the two instances do not fight over run/logs and run/options.txt.
        client2 {
            client()
            gameDirectory = project.file('run-neo2')
            programArguments.addAll '--username', 'Dev2'
        }

        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
            programArgument '--nogui'
        }

        gameTestServer {
            type = "gameTestServer"
            // Its own world, never run/: -PlotmOnly and all-mods runs also get separate worlds.
            gameDirectory = project.file(lotmOnly ? 'run-neo-gametest-lotm' : 'run-neo-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            gameDirectory = project.file('run-neo-data')
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "SmartBrainLib (SBL) Maven Repo"
        url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
    maven {
        // Photon, LDLib2, KilaGraph (LOTM's client effects)
        url = "https://maven.firstdark.dev/snapshots"
        content {
            includeGroupByRegex "com\\.lowdragmc.*"
        }
    }
    maven {
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
}

dependencies {
    //LOTMC (NeoForge port, local jar) and the libraries it needs at runtime
    implementation files(lotm_jar)
    implementation "maven.modrinth:pehkui:${pehkui_version}"
    implementation "net.tslat.smartbrainlib:SmartBrainLib-neoforge-${minecraft_version}:${sbl_version}"
    implementation "top.theillusivec4.curios:curios-neoforge:${curios_version}"
    implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    runtimeOnly "com.lowdragmc.photon:photon-neoforge-${minecraft_version}:${photon_version}:all"
    runtimeOnly "com.lowdragmc.ldlib2:ldlib2-neoforge-${minecraft_version}:${ldlib2_version}:all"
    runtimeOnly "com.lowdragmc.kilagraph:kilagraph-neoforge-${minecraft_version}:${kilagraph_version}"

    // Optional integrations that have a 1.21.1 NeoForge release. Awakened Bosses, Bosses of Mass
    // Destruction, Celestisynth, EEEAB's Mobs, Marium's Soulslike Weaponry, Obscure API and Terramity do
    // not, so their mixins and compat code were dropped in the port; their datapack boss profiles stay and
    // simply never match.
    //Aquamirae
    add(optionalMod, "curse.maven:aquamirae-536254:8931374")
    //Born in Chaos
    add(optionalMod, "curse.maven:borninchaos-686437:8268280")
    //Cataclysm
    add(optionalMod, "curse.maven:cataclysm-551586:8931182")
    //Legendary Monsters
    add(optionalMod, "curse.maven:legendarymonsters-944035:8902342")
    //Mowzie's Mobs
    add(optionalMod, "curse.maven:mowziesmobs-250498:7760267")
    //Mutant Monsters
    add(optionalMod, "curse.maven:mutantmonsters-852665:7232511")
    //TerraBlender
    add(optionalMod, "curse.maven:terrablender-940057:6054947")

    // Libraries the integrations above need at runtime
    //Better Combat
    add(optionalRuntime, "curse.maven:bettercombat-639842:8430183")
    //Player Animator
    add(optionalRuntime, "curse.maven:playeranimator-658587:7389814")
    //Cloth Config
    add(optionalRuntime, "curse.maven:clothconfig-348521:5729127")
    // AttributeFix is left out: no integration needs it, and its config library (Prickle) crashes the dev
    // client at load complete ("MinecraftPropertyPlugin not a subtype").
    //Fragmentum (Aquamirae)
    add(optionalRuntime, "curse.maven:fragmentum-1123977:9070553")
    //Caelus API
    add(optionalRuntime, "curse.maven:caelusapi-308989:5694215")
    //Citadel
    add(optionalRuntime, "curse.maven:citadel-331936:8458935")
    //Lionfish API
    add(optionalRuntime, "curse.maven:lionfishapi-1001614:8345326")
    //PuzzlesLib
    add(optionalRuntime, "curse.maven:puzzleslib-495476:9007719")
    //Jade
    runtimeOnly "curse.maven:jade-324717:8591319"
    //JEI
    runtimeOnly "curse.maven:jei-238222:9009406"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '100000'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
