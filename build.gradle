plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'maven-publish'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'com.github.johnrengelman.shadow' version '7.1.2'
}
apply plugin: 'net.minecraftforge.gradle'

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

mixin {
    add sourceSets.main, "pathtodivinity.refmap.json"
    // Register the config with the Mixin Gradle plugin. This is required for the DEV run:
    // mods.toml [[mixins]] is only honored for packaged jars (prod), NOT for the exploded
    // dev mod, so without this line none of this mod's mixins apply in runClient/runServer.
    // mods.toml [[mixins]] is kept for prod; duplicate registration is harmless (Mixin skips
    // an already-registered config).
    config "pathtodivinity.mixins.json"
    debug.export = true
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// -PlotmOnly: leave every optional integration off the runtime classpath (they stay compileOnly), to
// check that Path to Divinity still loads and works with only LOTM and its libraries, e.g.
// ./gradlew runGameTestServer -PlotmOnly
def lotmOnly = project.hasProperty('lotmOnly')
def optionalMod = lotmOnly ? 'compileOnly' : 'implementation'

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {

    mappings channel: mapping_channel, version: mapping_version

    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        // A second dev client, for testing anything that needs two players in the world at once —
        // profile regression and the characteristic drop, which both return early on a self-kill.
        // Needs its own username (two 'Dev' players cannot share a world) and its own working
        // directory, so the two instances do not fight over run/logs and run/options.txt.
        client2 {
            parent runs.client
            workingDirectory project.file('run2')
            args '--username', 'Dev2'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            // Its own world, never run/: -PlotmOnly and all-mods runs also get separate worlds.
            workingDirectory project.file(lotmOnly ? 'run-gametest-lotm' : 'run-gametest')
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
    maven {
        name = "SmartBrainLib (SBL) Maven Repo"
        url = "https://dl.cloudsmith.io/public/tslat/sbl/maven/"
    }
    maven {
        url = "https://jitpack.io"
    }
    maven {
        url = "https://cursemaven.com"
    }
    // Add 100 Media repository for Capability Syncer
    maven {
        name = '100Media'
        url = 'https://maven.100media.dev/'
    }
}

// Configure shading for Capability Syncer
configurations {
    shade
    implementation.extendsFrom shade
}

dependencies {
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:0.4.1"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:0.4.1")) {
        jarJar.ranged(it, "[0.4.1,)")
    }

    shade fg.deobf("dev._100media.capabilitysyncer:capabilitysyncer:1.20.1-4.0.1")

    //Pehkui
    implementation fg.deobf("com.github.Virtuoel:Pehkui:${pehkui_version}")
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    //Gecko Lib
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${minecraft_version}:${geckolib_version}")
    //Brain Lib
    implementation fg.deobf("net.tslat.smartbrainlib:SmartBrainLib-forge-${project.minecraft_version}:${project.sbl_version}")
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'


    //Aquamirae
    add(optionalMod, fg.deobf("curse.maven:aquamirae-536254:7985699"))
    //Awakened Bosses
    add(optionalMod, fg.deobf("curse.maven:awakenedbosses-548167:5057212"))
    //Better Combat
    implementation fg.deobf("curse.maven:bettercombat-639842:7287334")
    //Born in Chaos
    add(optionalMod, fg.deobf("curse.maven:borninchaos-686437:7917933"))
    //Bosses of Mass Destruction
    add(optionalMod, fg.deobf("curse.maven:bomd-438365:4993305"))
    //Cataclysm
    add(optionalMod, fg.deobf("curse.maven:cataclysm-551586:8246047"))
    //Celestisynth
    add(optionalMod, fg.deobf("curse.maven:celestisynth-872712:7686018"))
    //EEEAB's Mobs
    add(optionalMod, fg.deobf("curse.maven:eeeabmobs-921600:8073814"))
    //Legendary Monsters
    add(optionalMod, fg.deobf("curse.maven:legendarymonsters-944035:8312236"))
    //LOTMC
    implementation fg.deobf("curse.maven:lord-of-the-mysteries-craft-1095869:8612406")
    //Marium's Soulslike Weaponry
    add(optionalMod, fg.deobf("curse.maven:soulsweapons-632066:7321885"))
    //Mowzie's Mobs
    add(optionalMod, fg.deobf("curse.maven:mowziesmobs-250498:7815705"))
    //Mutant Monsters
    add(optionalMod, fg.deobf("curse.maven:mutantmonsters-852665:5107399"))
    //Terramity
    add(optionalMod, fg.deobf("curse.maven:terramity-1084134:6054971"))



    //AttributeFix
    implementation fg.deobf("curse.maven:attributefix-280510:7612291")
    //Caelus API
    implementation fg.deobf("curse.maven:caelusapi-308989:5281700")
    //Citadel
    implementation fg.deobf("curse.maven:citadel-331936:7476570")
    //Cloth Config
    implementation fg.deobf("curse.maven:clothconfig-348521:5729105")
    //Curios API
    implementation fg.deobf("curse.maven:curiosapi-309927:6418456")
    //Dreamcat LIB
    implementation fg.deobf("curse.maven:dreamcast-1323703:6869654")
    //Jade
    implementation fg.deobf("curse.maven:jade-324717:6855440")
    //JEI
    implementation fg.deobf("curse.maven:JEI-238222:8292131")
    //JER
    implementation fg.deobf("curse.maven:JER-240630:5057220")
    //Lionfish API
    implementation fg.deobf("curse.maven:lionfishapi-1001614:8095554")
    //Obscure API
    implementation fg.deobf("curse.maven:obscureapi-638417:7171906")
    //Patchouli
    implementation fg.deobf("curse.maven:patchouli-306770:7731017")
    //Player Animator
    implementation fg.deobf("curse.maven:bettercombat-658587:4587214")
    //Projectile Damage
    implementation fg.deobf("curse.maven:projectiledamage-643780:4597791")
    //PuzzlesLib
    implementation fg.deobf("curse.maven:puzzleslib-495476:6918565")
    //Terrablender
    implementation fg.deobf("curse.maven:terrablender-563928:6290448")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// Configure jar task for shading
tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'  // Important for shading
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }

    finalizedBy 'reobfJar'
}

// Configure Shadow plugin for shading Capability Syncer
shadowJar {
    archiveClassifier = ''
    configurations = [project.configurations.shade]
    relocate 'dev._100media.capabilitysyncer', "${project.group}.relocated.capabilitysyncer"
    finalizedBy 'reobfShadowJar'
}

assemble.dependsOn shadowJar

reobf {
    shadowJar {}
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url = "https://jitpack.io"
        }
        maven {
            url = "https://cursemaven.com"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}